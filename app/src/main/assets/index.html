<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PijatIN Maps REAL Drag</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script></head><body><div id="app"></div><script>
const cfg={apiKey:"AIzaSyCPVUa__Sgpkfuy_h__a6pqWfgFggWjAsA",authDomain:"pijatin-7cfb0.firebaseapp.com",projectId:"pijatin-7cfb0",storageBucket:"pijatin-7cfb0.firebasestorage.app",messagingSenderId:"503964879243",appId:"1:503964879243:android:663f9384e28c38fb0d478e"};firebase.initializeApp(cfg);const auth=firebase.auth(),db=firebase.firestore();
let cLat=-6.2416,cLng=106.9923,cAddr="Bekasi",cur=null,cData=null,pending=null,otp=null;
function hav(a,b,c,d){const R=6371,e=(c-a)*Math.PI/180,f=(d-b)*Math.PI/180,g=Math.sin(e/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(f/2)**2;return R*2*Math.atan2(Math.sqrt(g),Math.sqrt(1-g))}
async function rev(lat,lng){try{let r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);let j=await r.json();return j.display_name}catch{return lat.toFixed(6)+","+lng.toFixed(6)}}
function loginPage(){document.getElementById('app').innerHTML=`<div style="padding:24px;max-width:420px;margin:auto"><h1 style="font-weight:bold;font-size:24px;color:#2D4A3E">PijatIN Maps REAL</h1><p style="font-size:12px">OTP setelah Daftar + Maps drag pin REAL</p><div id="form" style="margin-top:12px"></div></div><div id="otpBox" style="display:none;position:fixed;bottom:0;left:0;right:0;background:white;padding:20px;border-radius:24px 24px 0 0"><h3>OTP Setelah Daftar</h3><div style="background:#FFF9C4;padding:10px;text-align:center"><b id="otpShow" style="font-size:28px;color:#D4AF37"></b></div><div id="otpIn" style="display:flex;gap:6px;justify-content:center;margin:10px 0"></div><button id="btnV" style="width:100%;padding:14px;background:#2D4A3E;color:#D4AF37;border-radius:12px">Verifikasi & Buat Akun REAL</button></div>`;let f=document.getElementById('form');f.innerHTML=`<input id="nama" placeholder="Nama" style="width:100%;padding:12px;background:white;border-radius:12px;margin-bottom:8px"><input id="hp" placeholder="HP 083893330346" style="width:100%;padding:12px;background:white;border-radius:12px;margin-bottom:8px"><input id="email" placeholder="Email" style="width:100%;padding:12px;background:white;border-radius:12px;margin-bottom:8px"><input id="pass" type="password" placeholder="Password" style="width:100%;padding:12px;background:white;border-radius:12px;margin-bottom:8px"><button id="bD" style="width:100%;padding:14px;background:#2D4A3E;color:#D4AF37;border-radius:12px">Daftar -> OTP REAL</button><hr style="margin:12px 0"><input id="e2" placeholder="Email login" style="width:100%;padding:12px;background:white;border-radius:12px;margin-bottom:8px"><input id="p2" type="password" placeholder="Password" style="width:100%;padding:12px;background:white;border-radius:12px;margin-bottom:8px"><button id="bM" style="width:100%;padding:14px;background:#D4AF37;border-radius:12px">Masuk REAL</button>`;document.getElementById('bD').onclick=async()=>{let n=document.getElementById('nama').value,h=document.getElementById('hp').value,e=document.getElementById('email').value,p=document.getElementById('pass').value;pending={nama:n,hp:h,email:e,pass:p};otp=Math.floor(100000+Math.random()*900000).toString();localStorage.setItem('otp',otp);document.getElementById('otpBox').style.display='block';document.getElementById('otpShow').innerText=otp;let div=document.getElementById('otpIn');div.innerHTML='';for(let i=0;i<6;i++){let inp=document.createElement('input');inp.maxLength=1;inp.style='width:40px;height:50px;text-align:center;background:#FAF6F0;border-radius:8px';div.appendChild(inp)};document.getElementById('btnV').onclick=async()=>{let code='';div.querySelectorAll('input').forEach(i=>code+=i.value);if(code!==localStorage.getItem('otp')){alert('Salah! Kode:'+localStorage.getItem('otp'));return}try{let c=await auth.createUserWithEmailAndPassword(pending.email,pending.pass);await db.collection('customers').doc(c.user.uid).set({uid:c.user.uid,name:pending.nama,phone:pending.hp,email:pending.email,lat:cLat,lng:cLng,address:cAddr,saldo:0,role:'customer',createdAt:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById('otpBox').style.display='none';}catch(err){alert(err.message)}}};document.getElementById('bM').onclick=async()=>{let e=document.getElementById('e2').value,p=document.getElementById('p2').value;try{await auth.signInWithEmailAndPassword(e,p)}catch(err){alert(err.message)}}}
function home(){document.getElementById('app').innerHTML=`<div><div style="background:#2D4A3E;color:white;padding:12px">Halo ${cData.name} - Maps REAL <button id="out" style="float:right;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:8px;font-size:12px">Logout</button></div><div style="padding:10px"><div style="display:flex;gap:6px"><input id="searchInput" placeholder="Cari alamat... Grand Galaxy, Bekasi Timur" style="flex:1;padding:12px;border-radius:12px;background:white"><button id="btnSearch" style="padding:12px;background:#D4AF37;border-radius:12px">Cari</button></div><div id="searchResults"></div><div id="map" style="height:380px;border-radius:20px;margin-top:8px"></div><div style="background:white;padding:12px;border-radius:12px;margin-top:8px"><p style="font-size:12px"><b>Titik Jemput REAL (drag pin / tap peta):</b></p><p id="addrText" style="font-size:13px">${cAddr}</p><p id="latlngText" style="font-size:11px;font-family:monospace">${cLat.toFixed(6)}, ${cLng.toFixed(6)}</p><div style="display:flex;gap:8px;margin-top:8px"><button id="btnCurLoc" style="flex:1;padding:10px;background:#E8F5E9;border-radius:10px;font-size:12px">📍 Lokasi Saya</button><button id="btnSaveLoc" style="flex:1;padding:10px;background:#2D4A3E;color:#D4AF37;border-radius:10px;font-size:12px">💾 Simpan Titik</button></div></div><h3 style="margin:12px 0 4px;font-weight:bold">Therapist Terdekat REAL - mitra isOnline==true</h3><div id="list"></div><button id="btnOrder" style="width:100%;padding:14px;background:#2D4A3E;color:#D4AF37;border-radius:12px;margin-top:12px">Pesan dengan Lokasi Pin REAL</button></div></div>`;document.getElementById('out').onclick=()=>auth.signOut();let map=L.map('map').setView([cLat,cLng],16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);let mCust=L.marker([cLat,cLng],{draggable:true}).addTo(map);mCust.on('dragend',async e=>{let p=e.target.getLatLng();cLat=p.lat;cLng=p.lng;let a=await rev(cLat,cLng);cAddr=a;document.getElementById('addrText').innerText=cAddr;document.getElementById('latlngText').innerText=cLat.toFixed(6)+', '+cLng.toFixed(6)});map.on('click',async e=>{cLat=e.latlng.lat;cLng=e.latlng.lng;mCust.setLatLng([cLat,cLng]);let a=await rev(cLat,cLng);cAddr=a;document.getElementById('addrText').innerText=cAddr;document.getElementById('latlngText').innerText=cLat.toFixed(6)+', '+cLng.toFixed(6)});document.getElementById('btnCurLoc').onclick=()=>{if(navigator.geolocation)navigator.geolocation.getCurrentPosition(async p=>{cLat=p.coords.latitude;cLng=p.coords.longitude;map.setView([cLat,cLng],16);mCust.setLatLng([cLat,cLng]);let a=await rev(cLat,cLng);cAddr=a;document.getElementById('addrText').innerText=cAddr;document.getElementById('latlngText').innerText=cLat.toFixed(6)+', '+cLng.toFixed(6)})};document.getElementById('btnSaveLoc').onclick=async()=>{try{await db.collection('customers').doc(cur.uid).update({lat:cLat,lng:cLng,address:cAddr});alert('Titik REAL disimpan!')}catch(e){alert(e.message)}};document.getElementById('btnSearch').onclick=async()=>{let q=document.getElementById('searchInput').value;let r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=5`);let j=await r.json();let cont=document.getElementById('searchResults');cont.innerHTML=j.map(x=>`<div data-lat="${x.lat}" data-lon="${x.lon}" style="padding:8px;background:white;border-bottom:1px solid #eee;cursor:pointer">${x.display_name}</div>`).join('');cont.querySelectorAll('div').forEach(d=>d.onclick=async()=>{cLat=parseFloat(d.dataset.lat);cLng=parseFloat(d.dataset.lon);map.setView([cLat,cLng],16);mCust.setLatLng([cLat,cLng]);cAddr=d.textContent;document.getElementById('addrText').innerText=cAddr;document.getElementById('latlngText').innerText=cLat.toFixed(6)+', '+cLng.toFixed(6);cont.innerHTML=''});};db.collection('mitra').where('isOnline','==',true).where('isAvailable','==',true).onSnapshot(s=>{let el=document.getElementById('list');if(s.empty){el.innerHTML='<div style="background:white;padding:16px;text-align:center;border-radius:12px;border:2px dashed #ccc"><b>0 Mitra Online REAL - Bukan Demo</b><br><small>Aktifkan app mitra -> isOnline true</small></div>';return}let arr=[];s.forEach(doc=>{let x=doc.data();x.id=doc.id;x.dist=hav(cLat,cLng,x.lat||-6.2,x.lng||106.8);arr.push(x)});arr.sort((a,b)=>a.dist-b.dist);el.innerHTML=arr.map(t=>`<div style="background:white;padding:10px;border-radius:10px;margin-bottom:6px"><b>${t.name||'Mitra'} ✅ REAL</b> - ${t.dist.toFixed(2)}km REAL dari pin kamu<div style="font-size:11px">${t.address||''}</div></div>`).join('');window.selList=arr;window.sel=arr[0]?.id});document.getElementById('btnOrder').onclick=async()=>{let t=(window.selList||[]).find(x=>x.id==window.sel);if(!t){alert('Tidak ada mitra online REAL');return}let ref=await db.collection('orders').add({customerId:cur.uid,customerName:cData.name,customerPhone:cData.phone||'',customerLat:cLat,customerLng:cLng,customerAddress:cAddr,price:t.price||120000,therapistId:t.id,status:'searching',otp:Math.floor(1000+Math.random()*9000).toString(),paymentVA:'3901083893330346',createdAt:firebase.firestore.FieldValue.serverTimestamp()});alert('Order REAL dengan pin REAL: '+ref.id+' - '+cAddr)}}auth.onAuthStateChanged(async u=>{cur=u;if(!u){loginPage();return}let d=await db.collection('customers').doc(u.uid).get();cData=d.exists?d.data():{name:u.email};if(d.exists&&d.data().lat){cLat=d.data().lat;cLng=d.data().lng;cAddr=d.data().address}home()});
</script></body></html>
