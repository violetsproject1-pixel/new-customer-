<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PijatIN Rumah Aja GOLD REAL</title>
<style>body{margin:0;font-family:sans-serif;background:#FFFBEB;color:#2D4A3E} .gold{background:#2D4A3E;color:#FFD700;padding:12px;text-align:center;font-weight:bold} .card{margin:12px;padding:16px;background:#fff;border-radius:12px;box-shadow:0 2px 8px #0001} input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box} button{width:100%;padding:14px;background:#2D4A3E;color:#FFD700;border:0;border-radius:10px;font-weight:bold;font-size:16px} .otp{background:#FFEB99;padding:18px;text-align:center;border-radius:10px;margin:10px 0} h1{margin:4px}</style>
</head>
<body>
<div class="gold">PijatIN Rumah Aja MEMBER GOLD • ORD-8393330346 • REAL Firebase</div>
<div class="card" id="root">
<h3>Daftar REAL - Firebase Auth REST</h3>
<input id="nama" placeholder="Nama" value="maliki">
<input id="hp" placeholder="HP" value="083893330346">
<input id="email" placeholder="Email" value="malikysyachmal2018@gmail.com">
<input id="pass" type="password" placeholder="Password" value="123456">
<div class="otp"><h1>263912</h1><small>KODE TEST (OTP Dummy)</small></div>
<button onclick="daftarReal()">Verifikasi & Buat Akun REAL</button>
<div id="log" style="margin-top:10px;font-size:12px;white-space:pre-wrap"></div>
</div>

<script>
const CFG={
  apiKey:"AIzaSyAsSbAM4i1qRbh69faFWlUT--AIdQ6fjhA",
  projectId:"pijatin-7cfb0"
};
const ORD="ORD-8393330346";
const log=(m)=>document.getElementById('log').textContent+=m+"\n";

async function daftarReal(){
  const nama=document.getElementById('nama').value||'maliki';
  const hp=document.getElementById('hp').value||'083893330346';
  const email=document.getElementById('email').value||'malikysyachmal2018@gmail.com';
  const pass=document.getElementById('pass').value||'123456';
  log("Daftar "+email+"...");
  
  // 1. Coba SignUp via REST (bypass file:// origin check!)
  let idToken, localId;
  try{
    let r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${CFG.apiKey}`,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email,password:pass,returnSecureToken:true})
    });
    let j=await r.json();
    if(j.error){
      if(j.error.message.includes("EMAIL_EXISTS")){
        log("Email sudah ada, coba SignIn...");
        let r2=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${CFG.apiKey}`,{
          method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({email,password:pass,returnSecureToken:true})
        });
        let j2=await r2.json();
        if(j2.error) throw j2.error;
        idToken=j2.idToken; localId=j2.localId;
      }else throw j.error;
    }else{
      idToken=j.idToken; localId=j.localId;
    }
    log("AUTH OK uid="+localId);

    // 2. Simpan ke Firestore customers/{uid} via REST
    let fsUrl=`https://firestore.googleapis.com/v1/projects/${CFG.projectId}/databases/(default)/documents/customers/${localId}?key=${CFG.apiKey}`;
    let payload={fields:{
      nama:{stringValue:nama},
      hp:{stringValue:hp},
      email:{stringValue:email},
      memberGold:{stringValue:ORD},
      cLat:{doubleValue:-6.2416},
      cLng:{doubleValue:106.9923},
      createdAt:{timestampValue:new Date().toISOString()}
    }};
    let rf=await fetch(fsUrl,{
      method:"PATCH",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+idToken},
      body:JSON.stringify(payload)
    });
    let jf=await rf.json();
    log("Firestore OK: "+JSON.stringify(jf.name||"saved"));

    // 3. Simpan session & tampilkan HOME GOLD REAL
    localStorage.setItem("pijatin_uid",localId);
    localStorage.setItem("pijatin_gold",ORD);
    document.getElementById('root').innerHTML=`
      <h2>✅ SUKSES REAL Firebase!</h2>
      <p><b>${nama}</b> • ${hp}<br>${email}<br><b style="color:#2D4A3E;background:#FFD700;padding:4px 8px;border-radius:6px">${ORD} MEMBER GOLD</b></p>
      <p>UID: ${localId}</p>
      <button onclick="location.reload()">Lanjut ke Home</button>
      <hr>
      <div id="mitraList">Load therapist REAL isOnline==true...</div>
    `;
    loadMitraReal(idToken);
  }catch(e){
    log("ERROR: "+JSON.stringify(e));
    alert("Error: "+(e.message||JSON.stringify(e)));
  }
}

async function loadMitraReal(idToken){
  try{
    // Query mitras where isOnline==true
    let qUrl=`https://firestore.googleapis.com/v1/projects/${CFG.projectId}/databases/(default)/documents:runQuery?key=${CFG.apiKey}`;
    let body={
      structuredQuery:{
        from:[{collectionId:"mitras"}],
        where:{fieldFilter:{field:{fieldPath:"isOnline"},op:"EQUAL",value:{booleanValue:true}}},
        limit:20
      }
    };
    let r=await fetch(qUrl,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+idToken},body:JSON.stringify(body)});
    let j=await r.json();
    let html="";
    (j||[]).forEach(d=>{
      if(!d.document) return;
      let f=d.document.fields||{};
      let nama=f.nama?f.nama.stringValue:"Therapist";
      // Filter: hapus Siti Rahayu dummy
      if(nama.toLowerCase().includes("siti rahayu")) return;
      html+=`<div class="card">${nama} • ONLINE ✅</div>`;
    });
    if(!html) html="<div class='card'>Belum ada mitra ONLINE REAL. Tambah di Firestore mitras isOnline=true</div>";
    document.getElementById('mitraList').innerHTML=html;
  }catch(e){
    document.getElementById('mitraList').innerHTML="Error load mitra: "+e;
  }
}
</script>
</body>
</html>
