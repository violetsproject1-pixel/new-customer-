<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PijatIN User REAL</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;font-family:sans-serif}
body{background:#0f0f14;color:white;margin:0;padding:16px}
.card{background:#1e1e2a;border-radius:16px;padding:16px;margin-bottom:12px}
input,select,button{width:100%;padding:14px;border-radius:12px;border:none;margin:6px 0}
button{background:#6C5CE7;color:white;font-weight:700;font-size:16px}
</style></head><body>
<h2>💆 PijatIN REAL CONNECT</h2>
<div class="card">
<input id="nama" placeholder="Nama Kamu">
<input id="alamat" placeholder="Alamat Lengkap Tangerang">
<select id="layanan"><option>Pijat Full Body 90mnt - 150k</option><option>Pijat Refleksi 60mnt - 100k</option><option>Pijat Panggilan 120mnt - 200k</option></select>
<select id="bayar"><option>BCA - 1234567890 a/n Violeta</option><option>BRI - 9876543210</option><option>COD Bayar di tempat</option></select>
<button onclick="pesan()">PESAN SEKARANG - REAL</button>
<p id="status"></p>
</div>
<div id="myorders"></div>
<script>
const firebaseConfig={apiKey:"AIzaSyCPVUa__Sgpkfuy_h__aGpqWfgFggWjAsA",authDomain:"pijatin-7cfb0.firebaseapp.com",projectId:"pijatin-7cfb0",storageBucket:"pijatin-7cfb0.firebasestorage.app",messagingSenderId:"503964879243",appId:"1:503964879243:android:965374dfd3ed8fc80d478e"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
function pesan(){
 const data={nama:document.getElementById('nama').value, alamat:document.getElementById('alamat').value, layanan:document.getElementById('layanan').value, bayar:document.getElementById('bayar').value, status:'menunggu_mitra', createdAt:firebase.firestore.FieldValue.serverTimestamp()};
 if(!data.nama||!data.alamat){alert('isi nama alamat');return;}
 db.collection('orders').add(data).then(()=>{document.getElementById('status').innerText='✅ Pesanan REAL terkirim! Menunggu mitra...';});
}
db.collection('orders').orderBy('createdAt','desc').limit(5).onSnapshot(s=>{
 let h=''; s.forEach(d=>{const o=d.data(); h+=`<div class="card">📦 ${o.layanan}<br>📍 ${o.alamat}<br>Status: <b>${o.status}</b></div>`}); document.getElementById('myorders').innerHTML=h;
});
</script></body></html>
