plugins { id 'com.android.application' }
android {
    compileSdk 34
    defaultConfig {
        applicationId "com.pijatin.customer"
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName "6.0-GOLD-FIXED"
    }
    buildTypes { release { minifyEnabled false } debug {} }
    compileOptions { sourceCompatibility 1_8; targetCompatibility 1_8 }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
}
